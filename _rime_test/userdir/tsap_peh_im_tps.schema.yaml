# Rime schema
# encoding: UTF-8 w/o BOM
# 依 tsap_peh_im_bpm2 架構改寫，鍵盤／輸入框改為【方音符號】（TPS）。
# 字典編碼為【台羅拼音】（ji_khoo_tl）；輸入順序：聲 + 韻 + 調。
#
# 【註】規格書 mapping 表有 p／1／ㄅ，但草稿 alphabet／xlit 漏列，此處已補上。
#       prism 自編譯為 tsap_peh_im_tps（與 zu_im_tps 鍵盤相近，但：
#       鼻韻符 ゜、陰平鍵 :、入聲通配 7＝&）。

schema:
  schema_id: tsap_peh_im_tps
  name: 十八音【方音符號】
  version: "v0.0.4"
  author:
    - 後學 CCC 整理
    - 居正中 <alanjui.1960@gmail.com>
  description: |
    基於《彙集雅俗通十五音》改良之新十五音輸入法
    【輸入類型】：注音輸入法（聲+韻+調）
    【拼音系統】：方音符號（TPS）
    【字典編碼】：台羅拼音（例：人 = lang5；腔 = khiunn1）
    【輸入框】：方音符號（鼻韻前置符 ゜；舒聲韻接入聲調時自動改促聲韻）
    【候選清單】：方音符號 + [聲+韻+調]（例：ㄌㄤˊ [柳江五]）
    【標點】：` 再按鍵（例：`, → ，）。【反查】：X 漢語拼音／C 倉頡／Z 注音
  dependencies:
    - luna_pinyin
    - cangjie5
    - bopomofo

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    states: [半角, 全角]
  - name: simplification
    states: [漢字, 汉字]
  - name: ascii_punct
    states: [，。, ，．]
  #-----------------------------------------------------------------------------
  # 【漢字標音選項】控制輸出按鍵 [Enter] 與 [Ctrl+Shift+Enter] 在上屏時，
  # 【漢字標音】應以何種【注音/拼音系統】標示漢字之讀音。
  #-----------------------------------------------------------------------------
  - options:
      [ key_in_piau_im_sni, key_in_piau_im_tps, key_in_piau_im_tlpa,
        key_in_piau_im_tlpa_zu_im, key_in_piau_im_tl, key_in_piau_im_poj,
        key_in_piau_im_bp, key_in_piau_im_bpm2, key_in_piau_im_ipa ]
    reset: 1
    states: [ 十五音, 方音符號, 台語音標, 台語音標注音, 台羅拼音, 白話字, 閩拼方案, 台語注音二式, 國際音標 ]
  - options: [ im_zat_hyphen, im_zat_space, im_zat_apos ]
    reset: 1
    states: [ 連字號, 空白, 撇號 ]

engine:
  processors:
    - lua_processor@aux_commit
    - lua_processor@jump_select
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    # 反查 affix 須在 abc 之前，否則 X／C／Z 後的字母會被主方案拼寫切走
    - affix_segmentor@reverse_lookup
    - affix_segmentor@cangjie5_lookup
    - affix_segmentor@bopomofo_lookup
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
    - reverse_lookup_translator@cangjie5_lookup
    - reverse_lookup_translator@bopomofo_lookup
  filters:
    - simplifier
    - uniquifier
    - lua_filter@tsap_peh_im_rev_comment_filter

speller:
  # !1q…＝聲／韻鍵；:5346][7＝調號（7＝入聲通配 &）；-＝鼻韻前置符 ゜
  alphabet: "!1qa2wsxeEdNcyYhnrRfv8ujK,ikmp/btgz9lM0;Oo*UJ<I(L-:5346][7"
  initials: "!1qa2wsxeEdNcyYhnrRfv8ujK,ikmp/btgz9lM0;Oo*UJ<I(L-"
  finals: ":5346][7"
  delimiter: "'"
  use_space: true
  algebra:
    #==========================================================================
    # 【台羅拼音】對映【按鍵】之【編碼】
    #==========================================================================
    - xform/6/7/
    #--------------------------------------------------------------------------
    # 聲母編碼
    # 【舌齒音 + i 】轉【齦顎音】（derive：ㄗㄧ／ㄐㄧ 皆可對到字典 ts+i）
    #--------------------------------------------------------------------------
    - xform/^ts(?!h)/z/     # ㄗ [ts]
    - xform/^tsh/c/         # ㄘ [tsh]
    - derive/^z(?=i)/Z/     # ㄐ [zi]
    - derive/^j(?=i)/J/     # ㆢ [ji]
    - derive/^c(?=i)/C/     # ㄑ [ci]
    - derive/^s(?=i)/S/     # ㄒ [si]
    - xform/^ng(?!\d|$)/ŋ/  # ㄫ [ng]
    - xform/^ph/P/          # ㄆ [ph]
    - xform/^th/T/          # ㄊ [th]
    - xform/^kh/K/          # ㄎ [kh]
    #--------------------------------------------------------------------------
    # 【促聲韻可用舒聲韻輸入】：促聲韻 = 舒聲韻 + 入聲調（4/8/&）
    # 例：不 put4 ← ㄅㄨㄣ[（pun4）。
    # 【注意】：此程式碼必須置於 oo [ɔ] 韻系【編碼】之前，即 oo 仍被視為【羅馬拼音】時處理。
    #--------------------------------------------------------------------------
    - derive/uainnh([48])/uainn$1/
    - derive/uaihnn([48])/uainn$1/
    - derive/iaunnh([48])/iaunn$1/
    - derive/iauhnn([48])/iaunn$1/
    - derive/iannh([48])/iann$1/
    - derive/iunnh([48])/iunn$1/
    - derive/ainnh([48])/ainn$1/
    - derive/uinnh([48])/uinn$1/
    - derive/aunnh([48])/aunn$1/
    - derive/auhnn([48])/aunn$1/
    - derive/ionnh([48])/ionn$1/
    - derive/uannh([48])/uann$1/
    - derive/annh([48])/ann$1/
    - derive/ahnn([48])/ann$1/
    - derive/ennh([48])/enn$1/
    - derive/ehnn([48])/enn$1/
    - derive/innh([48])/inn$1/
    - derive/ihnn([48])/inn$1/
    - derive/onnh([48])/onn$1/
    - derive/uaih([48])/uai$1/
    - derive/iauh([48])/iau$1/
    - derive/iok([48])/iong$1/
    - derive/iak([48])/iang$1/
    - derive/iat([48])/ian$1/
    - derive/iap([48])/iam$1/
    - derive/uat([48])/uan$1/
    - derive/uak([48])/uang$1/
    - derive/auh([48])/au$1/
    - derive/iah([48])/ia$1/
    - derive/uah([48])/ua$1/
    - derive/ueh([48])/ue$1/
    - derive/uih([48])/ui$1/
    - derive/ioh([48])/io$1/
    - derive/ooh([48])/oo$1/
    - derive/eeh([48])/ee$1/
    - derive/aih([48])/ai$1/
    - derive/iuh([48])/iu$1/
    - derive/ngh([48])/ng$1/
    - derive/ok([48])/ong$1/
    - derive/ak([48])/ang$1/
    - derive/ik([48])/ing$1/
    - derive/ut([48])/un$1/
    - derive/ip([48])/im$1/
    - derive/it([48])/in$1/
    - derive/ap([48])/am$1/
    - derive/at([48])/an$1/
    - derive/op([48])/om$1/
    - derive/oh([48])/o$1/
    - derive/uh([48])/u$1/
    - derive/ah([48])/a$1/
    - derive/ih([48])/i$1/
    - derive/eh([48])/e$1/
    - derive/mh([48])/m$1/
    #--------------------------------------------------------------------------
    # 韻母編碼
    # 【注意】：韻母：oo [ɔ] 韻及 o [ə] 韻，在【編碼】需遵循以下要點：
    # 1. 需依循 oo 韻，早於 o 韻之【處理順序】；
    # 2. 只可用 xform 編碼，不可改用 derive），否則，將致 ong 之編碼成 əng 。
    # 3. 韻母之編碼處理順序，亦須早於【鼻化韻母編碼】，否則 onn 之編碼會失去鼻化韻母符號。
    #--------------------------------------------------------------------------
    - xform/oo/O/
    - xform/ionn/iOnn/
    - xform/iong/iOng/
    - xform/iok/iOk/
    - xform/onn/Onn/
    - xform/ong/Ong/
    - xform/ok/Ok/
    - xform/om/Om/
    - xform/op/Op/
    - xform/o/ə/
    - xform/ir/w/
    - derive/ai/I/
    - derive/au/U/
    #--------------------------------------------------------------------------
    # 鼻化韻母編碼
    # 【鼻化韻母】 = 【韻母】 + nn
    # 【鼻化韻母】=【鼻化韻母符號】+【韻母】，例：ㆩ = ゜ㄚ,  ㄧㆩ = ゜ㄧㄚ
    # 1. nn 可視為【鼻化韻母識別符號】，簡稱：【鼻化韻符號】；
    # 2. 本輸入方案以【゜】 作為前置式【鼻化韻符號】；
    # 3. 【前置式鼻化韻符號】其【編碼】為：L，使用 L 編碼，因其形似方音符號之 ㄥ；
    # 4. 為便利輸入，元音韻母之疊字，輸入處理作業可自動更換成【鼻化韻母】。
    #--------------------------------------------------------------------------
    - derive/ann/d/
    - derive/inn/f/
    - derive/unn/q/
    - derive/enn/r/
    - derive/Onn/v/
    - derive/Inn/x/
    - derive/Unn/y/
    - derive/([iu]?[aiueOIU])nn/L$1/  # 3. 前置式鼻化韻符號
    - derive/([aiueOIU])nn/$1$1/      # 4. 疊字自動更換成【鼻化韻母】
    #--------------------------------------------------------------------------
    # 地方腔相容
    #--------------------------------------------------------------------------
    - derive/er(ng|k)/i$1/
    - derive/er(n|t)/u$1/
    - derive/er/e/
    - derive/ir(ng|k)/i$1/
    - derive/ir(n|t)/u$1/
    - derive/ire/ue/
    - derive/ou/O/
    - derive/ei/e/
    - derive/ee/e/
    - derive/ur/u/
    #--------------------------------------------------------------------------
    # 鼻音韻尾編碼
    # 1. ng/n/m 為鼻音韻尾 ==> 韻母 + ng／n／m
    # 2. 因【鼻音韻尾】與【聲母】同為：ng/n/m，識別 ng/n/m 為【聲母】或【鼻音韻尾】，方法如下：
    #   - ^(ng|n|m) ：起於【音節】開頭，是為【聲母】；
    #   - (ng|n|m)\d$ ：止於【調號】之前及【音節】結尾，是為【鼻音韻尾】；
    # 3. ng 與 m 亦屬【韻化輔音】，即 ng 與 m 可為【聲母】，亦可為【韻母】；
    #--------------------------------------------------------------------------
    - xform/ng(?=\d|$)/G/
    - xform/n(?=\d|$)/N/
    - xform/m(?=\d|$)/M/
    - derive/aG/A/
    - derive/aN/@/
    - derive/aM/Y/
    - derive/OG/H/
    - derive/OM/W/
    #--------------------------------------------------------------------------
    # 入聲韻尾編碼
    # 入聲韻尾 p/t/k/h → R/F/Q/V
    #--------------------------------------------------------------------------
    - derive/p([48])/R${1}/
    - derive/t([48])/F${1}/
    - derive/k([48])/Q${1}/
    - derive/h([48])/V${1}/
    - derive/p$/R/
    - derive/t$/F/
    - derive/k$/Q/
    - derive/h$/V/
    #--------------------------------------------------------------------------
    # 促聲調編碼
    # 1. 入聲調（4 或 8），統稱為：【促聲調】，【編碼】為【&】，【按鍵】為【7】；
    # 2. 支援【促聲調模糊化】操作：不確定調號為 4 或 8 ，可改用【促聲調符】→ & 代;
    # 【聲調略去】可只打聲+韻
    #--------------------------------------------------------------------------
    - derive/[48]$/&/
    # - derive/^([a-zA-ZəŋØ@]+)\d$/$1/
    - derive/^([a-zA-ZəŋØ@]+)&$/$1/
    #--------------------------------------------------------------------------
    # 輸入簡化規則：【聲調略去】：輸入【音節】時，可只輸入【聲母+韻母】，【調號】略去。
    #--------------------------------------------------------------------------
    - derive/^([a-zA-ZəŋØ@]+)\d$/$1/
    #--------------------------------------------------------------------------
    # 編碼與按鍵對映
    #--------------------------------------------------------------------------
    - 'xlit|bpPmtTnlkgKŋhzjcsZJCSaiuweOəMNGRFQVIUY@AWHdfqrvxy1732584&L|!1qa2wsxeEdNcyYhnrRfv8ujK,ikmp/btgz9lM0;Oo*UJ<I(L:5346][7-|'

translator:
  dictionary: ji_khoo_tl
  prism: tsap_peh_im_tps
  spelling_hints: 20
  always_show_comments: true
  initial_quality: 0.75
  preedit_format:
    - xform/'/ /
    # 按鍵 → 方音符號（含調名／入／゜）；須加引號，否則 YAML 會把 : 當成映射
    - "xlit|!1qa2wsxeEdNcyYhnrRfv8ujK,ikmp/btgz9lM0;Oo*UJ<I(L:5346][7-|ㆠㄅㄆㄇㄉㄊㄋㄌㄍㆣㄎㄫㄏㄗㆡㄘㄙㄐㆢㄑㄒㄚㄧㄨㆨㆤㆦㄜㆬㄣㆭㆴㆵㆻㆷㄞㄠㆰㄢㄤㆱㆲㆩㆪㆫㆥㆧㆮㆯ一七三二五八四入゜|"
    # 入聲尾亦可用聲母鍵 ㄅ／ㄉ／ㄍ／ㄏ 代替 ㆴ／ㆵ／ㆻ／ㆷ
    - xform/ㄅ(四|八|入)$/ㆴ$1/
    - xform/ㄉ(四|八|入)$/ㆵ$1/
    - xform/ㄍ(四|八|入)$/ㆻ$1/
    - xform/ㄏ(四|八|入)$/ㆷ$1/
    # 元音疊字＝鼻化韻（゜ 前置不在此合併，輸入框維持 ゜）
    - xform/ㄧㄧ/ㆪ/
    - xform/ㄨㄨ/ㆫ/
    - xform/ㄚㄚ/ㆩ/
    - xform/ㆦㆦ/ㆧ/
    - xform/ㆤㆤ/ㆥ/
    - xform/ㄞㄞ/ㆮ/
    - xform/ㄠㄠ/ㆯ/
    # - xform/ㆪㆦ/ㄧㆧ/
    # - xform/ㆪㄨ/ㄧㆫ/
    # - xform/ㆪㄚ/ㄧㆩ/
    # - xform/ㆪㄠ/ㄧㆯ/
    # - xform/ㆫㄚ/ㄨㆩ/
    # - xform/ㆫㄞ/ㄨㆮ/
    # 韻母調整
    - xform/ㄧㆭ/ㄧㄥ/
    - xform/ㄚㄧ/ㄞ/
    - xform/ㄚㄣ/ㄢ/
    - xform/ㄚㄨ/ㄠ/
    - xform/ㄚㆭ/ㄤ/
    - xform/ㄚㆬ/ㆰ/
    - xform/ㆦㆭ/ㆲ/
    - xform/ㆦㆬ/ㆱ/
    # 【舒聲韻接入聲調】顯示：ㄅㄨㄣ[ → ㄅㄨㆵ；ㄅㄨㄣ7 → ㄅㄨㆵ入
    - xform/ㄨㆮ(四|八|入)/ㄨㆮㆷ$1/
    - xform/ㄧㆯ(四|八|入)/ㄧㄠㆷ$1/
    - xform/ㄧㆲ(四|八|入)/ㄧㆦㆻ$1/
    - xform/ㄧㄤ(四|八|入)/ㄧㄚㆻ$1/
    - xform/ㄨㆪ(四|八|入)/ㄨㄧㆷ$1/
    - xform/ㄧㆩ(四|八|入)/ㄧㆩㆷ$1/
    - xform/ㆮ(四|八|入)/ㆮㆷ$1/
    - xform/ㄧㆫ(四|八|入)/ㄧㆫㆷ$1/
    - xform/ㄧㄢ(四|八|入)/ㄧㄚㆵ$1/
    - xform/ㆲ(四|八|入)/ㆦㆻ$1/
    - xform/ㄨㄞ(四|八|入)/ㄨㄞㆷ$1/
    - xform/ㄧㄥ(四|八|入)/ㄧㆻ$1/
    - xform/ㄨㄢ(四|八|入)/ㄨㄚㆵ$1/
    - xform/ㄧㄠ(四|八|入)/ㄧㄠㆷ$1/
    - xform/ㄧㆰ(四|八|入)/ㄧㄚㆴ$1/
    - xform/ㆩ(四|八|入)/ㆩㆷ$1/
    - xform/ㆥ(四|八|入)/ㆥㆷ$1/
    - xform/ㆪ(四|八|入)/ㄧㆷ$1/
    - xform/ㄨㄣ(四|八|入)/ㄨㆵ$1/
    - xform/ㄧㆬ(四|八|入)/ㄧㆴ$1/
    - xform/ㄨㄧ(四|八|入)/ㄨㄧㆷ$1/
    - xform/ㄢ(四|八|入)/ㄚㆵ$1/
    - xform/ㆦ(四|八|入)/ㆦㆷ$1/
    - xform/ㄞ(四|八|入)/ㄞㆷ$1/
    - xform/ㄧㄣ(四|八|入)/ㄧㆵ$1/
    - xform/ㆰ(四|八|入)/ㄚㆴ$1/
    - xform/ㄨㄚ(四|八|入)/ㄨㄚㆷ$1/
    - xform/ㄠ(四|八|入)/ㄠㆷ$1/
    - xform/ㄧㄚ(四|八|入)/ㄧㄚㆷ$1/
    - xform/ㄨㆤ(四|八|入)/ㄨㆤㆷ$1/
    - xform/ㄧㄨ(四|八|入)/ㄧㄨㆷ$1/
    - xform/ㄧㄜ(四|八|入)/ㄧㄜㆷ$1/
    - xform/ㆭ(四|八|入)/ㆭㆷ$1/
    - xform/ㆱ(四|八|入)/ㆦㆴ$1/
    - xform/ㄤ(四|八|入)/ㄚㆻ$1/
    - xform/ㄜ(四|八|入)/ㄜㆷ$1/
    - xform/ㄨ(四|八|入)/ㄨㆷ$1/
    - xform/ㄚ(四|八|入)/ㄚㆷ$1/
    - xform/ㄧ(四|八|入)/ㄧㆷ$1/
    - xform/ㆤ(四|八|入)/ㆤㆷ$1/
    - xform/ㆬ(四|八|入)/ㆬㆷ$1/
    # 顎化自動更正
    - xform/ㆡ(ㄧ|ㆪ)/ㆢ$1/
    - xform/ㄗ(ㄧ|ㆪ)/ㄐ$1/
    - xform/ㄘ(ㄧ|ㆪ)/ㄑ$1/
    - xform/ㄙ(ㄧ|ㆪ)/ㄒ$1/
    # 調號：陰平 ˉ（不可刪「一」，否則 : 看起來像沒打進去）；陰入無標；7＝入 保留「入」
    - xform/一/ˉ/
    - xform/七/˫/
    - xform/三/˪/
    - xform/二/ˋ/
    - xform/五/ˊ/
    - xform/四//
    - xform/八/˙/
  comment_format: &tsap_peh_im_comment_format
    #==========================================================================
    # 候選：左欄方音符號（調符）；右欄 [聲+韻+調]
    # 例：ㄌㄤˊ [柳江五]
    #==========================================================================
    - xform/'/ /
    - xform/\s+/ /
    - xform/6/7/
    # 零聲母 + 韻化輔音 m／ng（十八音側保留 ;Ø → 英）
    - xform/\b((?:m|ng)\d)\b/【》Ø$1】 ;Ø$1/
    # 零聲母 + 元音／複合／鼻化韻
    - xform/\b([iu]?(?:ai|au|oo|[aiueo])[a-z]*\d)\b/【》Ø$1】 ;Ø$1/
    # 聲母 + 韻母 + 調號
