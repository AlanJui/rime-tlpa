reverse_lookup:
  tag: reverse_lookup
  dictionary: luna_pinyin
  prefix: "X"
  suffix: "'"
  tips: 〔漢語拼音〕
  preedit_format:
    - xform/^X//
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  comment_format:
    *tsap_peh_im_comment_format

cangjie5_lookup:
  tag: cangjie5_lookup
  dictionary: cangjie5
  enable_completion: true
  overwrite_comment: false
  always_show_comments: true
  prefix: "C"
  suffix: "'"
  tips: 〔倉頡五代〕
  preedit_format:
    - xlit|abcdefghijklmnopqrstuvwxyz~|日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜符～|
  comment_format:
    *tsap_peh_im_comment_format

bopomofo_lookup:
  tag: bopomofo_lookup
  dictionary: terra_pinyin
  prism: bopomofo
  enable_completion: true
  overwrite_comment: false
  always_show_comments: true
  prefix: "Z"
  suffix: "'"
  tips: 〔注音符號〕
  preedit_format:
    - "xlit|1qaz2wsxedcrfv5tgbyhnujm8ik,9ol.0p;/- 6347'|ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦˉˊˇˋ˙ |"
  comment_format:
    *tsap_peh_im_comment_format

menu:
  # alternative_select_keys: "GHJKL"
  # alternative_select_labels: [ G, H, J, K, L ]
  alternative_select_labels: [①, ②, ③, ④, ⑤] # 修改候選標籤
  page_size: 5

punctuator:
  # 方音鍵佔用 , ; . [ ] 等，無法像拼音方案直接出全形標點。
  # 與 zu_im_tps 相同：先按 ` 再按標點（`, → ，）。
  import_preset: keymap_piau_tian

# 陰平鍵是 Shift+;（:）。預設 Shift_L＝inline_ascii 會把 Shift 吃掉，: 進不了拼寫。
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Shift_L: noop
    Shift_R: commit_text
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear

key_binder:
  import_preset: default
  bindings:
    # 鼻韻前置符 ゜；default 在 has_menu 時 minus＝Page_Up，必須覆寫
    - { when: composing, accept: minus, send: minus }
    - { when: has_menu, accept: minus, send: minus }
    # 調號：: 一／3 三／4 二／5 七／6 五／[ 四／] 八／7 入
    # Weasel 按 : 常送出 Shift+semicolon，不是 colon；不轉送則會變成韻母鍵 ;＝ㄤ
    - { when: composing, accept: "Shift+semicolon", send: colon }
    - { when: has_menu, accept: "Shift+semicolon", send: colon }
    - { when: composing, accept: "Shift+colon", send: colon }
    - { when: has_menu, accept: "Shift+colon", send: colon }
    - { when: composing, accept: colon, send: colon }
    - { when: has_menu, accept: colon, send: colon }
    - { when: composing, accept: "3", send: "3" }
    - { when: has_menu, accept: "3", send: "3" }
    - { when: composing, accept: "4", send: "4" }
    - { when: has_menu, accept: "4", send: "4" }
    - { when: composing, accept: "5", send: "5" }
    - { when: has_menu, accept: "5", send: "5" }
    - { when: composing, accept: "6", send: "6" }
    - { when: has_menu, accept: "6", send: "6" }
    - { when: composing, accept: "[", send: "[" }
    - { when: has_menu, accept: "[", send: "[" }
    - { when: composing, accept: "]", send: "]" }
    - { when: has_menu, accept: "]", send: "]" }
    - { when: composing, accept: "7", send: "7" }
    - { when: has_menu, accept: "7", send: "7" }
    - { when: composing, accept: "Shift+7", send: "7" }
    - { when: has_menu, accept: "Shift+7", send: "7" }
    - { when: composing, accept: "&", send: "7" }
    - { when: has_menu, accept: "&", send: "7" }
    # 韻母鍵：逗號 ㆤ、分號 ㄤ、星號 ㆩ
    - { when: composing, accept: comma, send: comma }
    - { when: has_menu, accept: comma, send: comma }
    - { when: composing, accept: semicolon, send: semicolon }
    - { when: has_menu, accept: semicolon, send: semicolon }
    - { when: composing, accept: asterisk, send: asterisk }
    - { when: has_menu, accept: asterisk, send: asterisk }
    - { when: composing, accept: "Shift+8", send: asterisk }
    - { when: has_menu, accept: "Shift+8", send: asterisk }
    # Vim Mode
    - { when: has_menu, accept: "Control+h", send: Page_Up }
    - { when: has_menu, accept: "Control+l", send: Page_Down }
    - { when: has_menu, accept: "Control+k", send: Up }
    - { when: has_menu, accept: "Control+j", send: Down }
    - { when: always, accept: "Control+m", toggle: dict_mode }

editor:
  bindings:
    Return: commit_composition
    Control+Return: commit_raw_input
    Shift+Return: commit_script_text
    # Control+Shift+Return 由 lua_processor@aux_commit 攔截

recognizer:
  import_preset: default
  patterns:
    # ` 觸發標點（`, → ，）；/ 為韻母ㆭ，不能再用 /fh
    punct: '`[^\s]$'
    reverse_lookup: "X[-/,.;0-9a-z]*'?$"
    cangjie5_lookup: "C[-/,.;0-9a-z]*'?$"
    bopomofo_lookup: "Z[-/,.;0-9a-z]*'?$"
    # 排除反查前綴 X／C／Z，以及方音鍵之英文大寫（E N Y R K M O U J I L），
    # 否則連打第二音節若以ㆣ／ㆡ／ㄫ…起頭會被當成英文。
    uppercase: "^[ABDFGHPQSTVW][-_+.'0-9ABDFGHPQSTVWa-z]*$"

style:
  horizontal: false
  font_face: "霞鶩文楷 TC, 新細明體"
  comment_font_face: "Cascadia Next TC Medium, 霞鶩文楷 TC, BopomofoRuby1909-v1, 新細明體"
  comment_font_size: 18
