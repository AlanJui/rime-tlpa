# Rime schema
# vim: set sw=2 sts=2 et nowrap:
# encoding: utf-8
# v0.1.0 (2026/8/6)：依 huan_ciat_tps 改寫，字典編碼為【韻+調+聲】。

schema:
  schema_id: huan_ciat_ZapGooIm_tps
  name: 十五音輸入法【方音符號】
  version: "v0.1.0"
  author:
    - 居正中 <alanjui.1960@gmail.com>
  description: |
    使用者以【方音符號】按鍵，依《彙集雅俗通十五音》【韻+調+聲】順序輸入。
    輸入法將方音符號對映至十五音，並由【韻+調+聲】字典推測候選漢字。

    【拼音系統】：台語音標+（TLPA+）
    【字典編碼】：韻母 + 調號 + 聲母（例：君 = un1k；溫 = un1q）
    【輸入順序】：先韻母方音 → 再調號 → 後聲母方音（零聲母按鍵 =）
    【候選清單】：左欄十五音（韻+調+聲），右欄方音符號。
    【特性簡介】：
      1. 例：輸入 ㄨㄣ + 調 + ㄍ → 輸入列顯示【君一求】，候選如【君一求】〔ㄍㄨㄣ〕
      2. 【聲調標示】採台羅八聲調名；調號採與注音相容之方音符號。

switches:
  - name: ascii_mode
    reset: 0
    states: [漢文, ABC]
  - name: full_shape
    reset: 0
    states: [半形, 全形]
  # 【漢字標音選項】控制輸出按鍵 [Enter] 與 [Ctrl+Shift+Enter] 在上屏時，
  # 【漢字標音】應以何種【注音/拼音系統】標示漢字之讀音。
  # 【註】options 與 states 依「位置序號」一一對應，兩列表之項目數與排序必須一致，
  #       否則選單顯示之名稱與實際啟動之選項會錯位。
  - options:
      [ key_in_piau_im_sni, key_in_piau_im_tps, key_in_piau_im_tlpa,
        key_in_piau_im_tlpa_zu_im, key_in_piau_im_tl, key_in_piau_im_poj,
        key_in_piau_im_bp, key_in_piau_im_bpm2, key_in_piau_im_ipa ]
    reset: 0
    states: [ 十五音, 方音符號, 台語音標, 台語音標注音, 台羅拼音, 白話字, 閩拼方案, 台語注音二式, 國際音標 ]
  # 【音節連接符】控制輸出按鍵 [Enter] 與 [Ctrl+Shift+Enter] 上屏時，
  # 詞彙（2 個以上音節）之標音，音節與音節之間所使用的連接符號。
  - options: [ im_zat_hyphen, im_zat_space, im_zat_apos ]
    reset: 1
    states: [ 連字號, 空白, 撇號 ]

engine:
  processors:
    - lua_processor@aux_commit    # 輸出【漢字標音】，而非【漢字】
    - lua_processor@jump_select   # 務必置頂，用以攔截【快捷鍵】，如：Ctrl+M, Ctrl+<, Ctrl+>
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - fluid_editor
    # - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier
    # 為 filter 除錯用
    # - lua_filter@append_ok_filter
    # - lua_filter@force_mark_filter
    - lua_filter@reformat_comment_filter

speller:
  # 輸入順序：【韻】方音鍵 → 【調】鍵 → 【聲】方音鍵（零聲母 =）
  # 聲母鍵設為 finals，避免「韻+調」已匹配時，下一個聲母被當成新音節起頭
  # （例：uo7 之後的 x＝柳 必須接成 uo7x，不能拆成 uo7 | x）
  # ? = 【韻 ? 聲】任意調萬用字元（* 鍵已用作 ㆩ，故不用作萬用調）
  # 亦可直接【韻+聲】省略調號（不必打 ?）
  alphabet: "!1qas2wxEedNYyhncRrfv8uKj,ikmp/btgz9lM0;Oo*UJ<I(L-=\"5346][7.?"
  initials: "!1qas2wxEedNYyhncRrfv8uKj,ikmp/btgz9lM0;Oo*UJ<I(L-="
  finals: "!1qas2wxEedNYyhncRrfv8="
  delimiter: "'"
  use_space: true
  #=============================================================================
  # 字典編碼：【韻+調+聲】；捕捉式 ^([a-z]+)(\d)([a-z]*)$
  #=============================================================================
  algebra:
    #==========================================================================
    # 聲調校調
    #==========================================================================
    # 【陽上調（6）】視作【陽去調（7）】
    - xform/6/7/
    # ZapGooIm 零聲母 q → Ø（須在 unn→q 鼻化規則之前）
    - xform/(\d)q/$1Ø/
    #==========================================================================
    # 韻母校調
    #==========================================================================
    #
    # --------------------------------------------------------------------------
    # 十五音韻母校調
    # --------------------------------------------------------------------------
    # 稽 [ei], 嘉 [ɛ], 伽 [e] ==> 調整同音：伽 = 嘉 = 稽 = ㆤ
    - xform/ei/e/  # 稽 [ei] = 伽 [e] = ㆤ
    - xform/ee/e/  # 嘉 [ɛ] = 伽 [e] = ㆤ
    # --------------------------------------------------------------------------
    # 【元音韻母】與【複合韻母】：ㄞ[ai]、ㄠ[au]
    # --------------------------------------------------------------------------
    # 【元音韻母】
    #  ㄚ [a]
    #  ㄧ [i]
    #  ㄨ [u]
    #  ㆤ [e]
    #  ㆦ [oo]
    - xform/ir/w/ # ㆨ [ir]
    # --------------------------------------------------------------------------
    # 【方音腔韻母】校調
    # --------------------------------------------------------------------------
    - derive/er(ng|k)/i$1/
    - derive/er(G|k)/i$1/
    - derive/er(n|t)/u$1/
    - derive/er/e/
    # 泉州腔
    - derive/ir(ng|k)/i$1/
    - derive/ir(n|t)/u$1/
    - derive/ire/ue/
    - derive/ir/e/
    # 漳州腔
    - derive/ou/O/
    - derive/ei/e/
    - derive/ee/e/ # 漳州/泉州腔
    # 廈門腔
    - derive/ur/u/
    # 白話字
    - xform/e(ng|k)/i$1/
    - xform/ao/au/
    # --------------------------------------------------------------------------
    # 區分 oo 及 o 所使用之羅馬拼音字母：【o】與【ə】
    # 將羅馬拼音字母 o 留予 oo [ɔ] 韻使用；使用【拼音符號】 ə [ə]
    # 《範例》：【何】：【ho5】= 【hə5】
    # --------------------------------------------------------------------------
    #==========================================================================
    # 【舒聲韻偷懶打入聲】（與 huan_ciat_ZapGooIm_tlpa 相同）
    # 字典為促聲韻+入聲調（例：六 iok8l），允許以對應舒聲韻輸入：
    #   1) 舒聲韻鍵 + ]（陽入 8）+ 聲
    #   2) 舒聲韻鍵 + 7/&（不確定 4/8）+ 聲
    #   3) 舒聲韻鍵 + ?（不確定調號）+ 聲
    # 【註】須在 iong→iOng / iok→iOk 等轉換之前（仍為羅馬拼音）。
    #==========================================================================
    # 鼻音／複合（最長優先）
    - derive/uainnh([48])/uainn$1/   # 閂
    - derive/uaihnn([48])/uainn$1/
    - derive/iauhnn([48])/iaunn$1/   # 嘄
    - derive/iannh([48])/iann$1/     # 驚
    - derive/iunnh([48])/iunn$1/     # 牛
    - derive/ainnh([48])/ainn$1/     # 閒
    - derive/uinnh([48])/uinn$1/     # 褌
    - derive/auhnn([48])/aunn$1/
    - derive/annh([48])/ann$1/       # 監
    - derive/ennh([48])/enn$1/       # 更
    - derive/ahnn([48])/ann$1/
    - derive/ehnn([48])/enn$1/
    - derive/ihnn([48])/inn$1/       # 梔
    # 塞音／喉塞尾
    - derive/uaih([48])/uai$1/       # 乖
    - derive/iauh([48])/iau$1/       # 嬌
    - derive/iok([48])/iong$1/       # 恭 ← 六
    - derive/iak([48])/iang$1/       # 姜
    - derive/iat([48])/ian$1/        # 堅
    - derive/iap([48])/iam$1/        # 兼
    - derive/uat([48])/uan$1/        # 觀
    - derive/uak([48])/uang$1/       # 光
    - derive/auh([48])/au$1/         # 交
    - derive/iah([48])/ia$1/         # 迦
    - derive/uah([48])/ua$1/         # 瓜
    - derive/ueh([48])/ue$1/         # 檜
    - derive/uih([48])/ui$1/         # 規
    - derive/ioh([48])/io$1/         # 茄
    - derive/ooh([48])/oo$1/         # 沽
    - derive/ngh([48])/ng$1/         # 鋼
    - derive/ok([48])/ong$1/         # 公
    - derive/ak([48])/ang$1/         # 江
    - derive/ik([48])/ing$1/         # 經
    - derive/ut([48])/un$1/          # 君
    - derive/ip([48])/im$1/          # 金
    - derive/it([48])/in$1/          # 巾
    - derive/ap([48])/am$1/          # 甘
    - derive/at([48])/an$1/          # 干
    - derive/op([48])/om$1/          # 箴
    - derive/oh([48])/o$1/           # 高
    - derive/uh([48])/u$1/           # 艍
    - derive/ah([48])/a$1/           # 膠
    - derive/ih([48])/i$1/           # 居
    - derive/eh([48])/e$1/           # 伽
    - derive/mh([48])/m$1/           # 姆
    # 【註】derive/4/&/、derive/8/&/ 須在 ng→G、OG→H、聲母 (\\d)… 之後
    # 否則 iong& 無法變成 iH&，按鍵 uo7x（六）對不到編碼。

    # 羅馬字母： oo [ɔ] 改 O (大寫 O) = ㆦ
    - xform/oo/O/ # ㆦ [oo]
    # --------------------------------------------------------------------------
    # 以下之【韻母】，其羅馬字母：o 當視作 oo [ɔ] 韻使用
    # onn|iong|iok|ong|ok|om|op
    # - xform/io(?nn|ng|k)/iO$1/
    - xform/ionn/iOnn/
    - xform/iong/iOng/
    - xform/iok/iOk/ # 台語注音二式無此韻母，其拼音為：[iook] ==> [iOk] ==> ㄧㆦㄍ
    # - xform/o(?onn|nn|ng|k|m|p)/O$1/
    - xform/onn/Onn/ # ㆧ [oonn] = O + nn
    - xform/ong/Ong/
    - xform/ok/Ok/
    - xform/om/Om/
    - xform/op/Op/
    # --------------------------------------------------------------------------
    # 台語注音二式羅馬字母： or [ə] 改 ə = ㄜ
    # - derive/or/ə/
    # 羅馬字母： o [ə] 改 ə = ㄜ
    - xform/o/ə/ # ㄜ [ə] - 只轉換獨立的 o
    # --------------------------------------------------------------------------
    # 【複合韻母】
    - derive/ai/I/ # ㄞ [ai]
    - derive/au/U/ # ㄠ [au]
    # --------------------------------------------------------------------------
    # 【鼻化韻母】
    # --------------------------------------------------------------------------
    # 可用【鼻化韻母後綴識別符號】輸入
    - derive/ann/d/ # ㆩ [ann]
    - derive/inn/f/ # ㆪ [inn]
    - derive/unn/q/ # ㆫ [unn]
    - derive/enn/r/ # ㆥ [enn]
    - derive/Onn/v/ # ㆧ [onn]
    - derive/Inn/x/ # ㆮ [ainn]
    - derive/Unn/y/ # ㆯ [aunn]
    # --------------------------------------------------------------------------
    # 【鼻化韻母】輸入，可用連續兩次的輸入達成
    #--------------------------------------------------------------------------
    - derive/([aiueOIU])nn/$1$1/
    # -------------------------------------------------------------------------
    # 【鼻音韻母】使用【鼻音前綴識別符號】：ñ
    #--------------------------------------------------------------------------
    # a/i/u/e/oo/iau/uai/ai/au/ia/io/iu/ua/ui
    # 【註】：台羅拼音使用 onn [ɔ̃] ==> ㆧ，如： 唔（onn），沒有所謂的 oonn 韻母
    - derive/([iu]?[aiueOIU])nn/L$1/
    # 為所有【鼻化韻母】建置【字典編碼】：【L】
    - abbrev/L([iu]?[aiueOIU])/L/
    #==========================================================================
    # 【閩南話變調規則】
    # 為強化使用者輸入之便利性，即便輸入【變調】，仍能推算出【本調】之漢字
    # 為字典中的【本調】產生【變調】的衍生拼音
    #==========================================================================
    # 舒聲變調規則 (17325)
    - derive/1/7/ # 第一調 → 第七調 (kim1 → kim7)
    - derive/7/3/ # 第七調 → 第三調
    - derive/3/2/ # 第三調 → 第二調
    - derive/2/1/ # 第二調 → 第一調
    - derive/5/7/ # 第五調 → 第七調
    #--------------------------------------------------------------------------
    # 入聲變調規則 (48)
    # 入聲尾韻為 h 的變調
    - derive/(?<![ptk])4/2/ # -h 第四調 → 第二調
    - derive/(?<![ptk])8/3/ # -h 第八調 → 第三調
    #--------------------------------------------------------------------------
    # 入聲尾韻為 p/t/k 的變調
    - derive/4([ptk])/8$1/ # -p/-t/-k 第四調 → 第八調
    - derive/8([ptk])/4$1/ # -p/-t/-k 第八調 → 第四調
    #==========================================================================
    # 鼻音韻尾（調號前）須先於聲母規則
    #==========================================================================
    # 調號可為數字或 &（入聲不確定）；& 多半在後面才 derive，此處一併相容
    - xform/ng(?=[\d&])/G/ # ㆭ：韻尾 -ng
    - xform/n(?=[\d&])/N/  # ㄣ：韻尾 -n
    - xform/m(?=[\d&])/M/  # ㆬ：韻尾 -m

    #==========================================================================
    # 【聲母】在調號之後（韻+調+聲）
    #==========================================================================
    - xform/(\d|&)ph/$1P/ # ㄆ [ph]
    - xform/(\d|&)th/$1T/ # ㄊ [th]
    - xform/(\d|&)kh/$1K/ # ㄎ [kh]
    - xform/(\d|&)ng/$1ŋ/ # ㄫ [ng] 聲母
    - xform/(\d|&)tsh/$1c/ # ㄘ
    - xform/(\d|&)ts/$1z/  # ㄗ
    # 齦顎音：韻以 i 起頭時
    - derive/^(i.*)(\d|&)j/$1$2J/
    - derive/^(i.*)(\d|&)z/$1$2Z/
    - derive/^(i.*)(\d|&)c/$1$2C/
    - derive/^(i.*)(\d|&)s/$1$2S/
    # --------------------------------------------------------------------------
    # 校調【複合韻母】，改成【方音符號】或【國/台語共用注音符號】
    # -------------------------------------------------------------------------
    # 校調【複合韻母】改成【國/台語共用注音符號】
    - derive/aG/A/ # ㄤ aG [ang] = a + ng
    - derive/aN/@/ # ㄢ aN [an] = a + n
    # 校調【複合韻母】改成【方音符號】
    - derive/aM/Y/ # ㆰ aM [am] = a + m
    - derive/OG/H/ # ㆲ OG [ong] = o + ng
    - derive/OM/W/ # ㆱ OM [oom] = o + m

    #==========================================================================
    # 【入聲韻母】：
    #==========================================================================
    # am/an/ang/im/in/ing/un/ong/iam/ian/iang/iong/uan/uang
    # (1) ap, ip, iap,
    # (2) at, it, ut, iat, uat
    # (3) ak, ik, ok, iak, iok
    # (4) ah, ih, uh, eh, ooh, oh, aih, auh, iah, iuh, ioh, uah, uih, ueh, iauh, uaih
    #--------------------------------------------------------------------------
    # 【入聲韻尾】：p/t/k/h，【字典編碼】：R/F/Q/V
    #--------------------------------------------------------------------------
    # 【鼻音韻尾】==》【入聲韻尾】
    #   (1) -m  ==> -p
    #   (2) -n  ==> -t
    #   (3) -ng ==> -k
    #==========================================================================
    # 音節中有入聲調號（4/8）
    - derive/p([48])/R${1}/  # ㄅ [p/b] --> ㆴ [R]
    - derive/t([48])/F${1}/  # ㄉ [t/d] --> ㆵ [F]
    - derive/k([48])/Q${1}/  # ㄍ [k/g] --> ㆻ [Q]
    - derive/h([48])/V${1}/  # ㄏ [h/h] --> ㆷ [V]
    #--------------------------------------------------------------------------
    # 【註】韻+調+聲 無調時音節尾是【聲母】，不可再用 p$/t$/k$/h$ 當入聲韻尾
    #--------------------------------------------------------------------------
    # 【所有入聲韻尾】 ==》【字典編碼】：【6】，【鍵盤按鍵】：【7】
    - derive/([RFQV])[48]/${1}6/
    - abbrev/[RFQV]6/&/

    #==========================================================================
    # 入聲調不確定 4/8（按鍵 7 → &）
    # 須在 iong→iOng→iOG→iH、聲母規則之後，舒聲偷懶的 iong8l 才能變成 iH&l → uo7x
    #==========================================================================
    - derive/4/&/
    - derive/8/&/

    #==========================================================================
    # 【零聲母】字典尾端 Ø（由 q 轉來）；可省略只打到調號
    #==========================================================================
    - derive/^([a-zA-ZəŋØ@]+(?:\d|&))Ø$/$1/

    #==========================================================================
    # 【輸入簡化】編碼：韻+調+聲
    #==========================================================================
    # 無調：韻+聲（例：unl → un1l/un2l/…；輸入框「君ㄌ」）
    - derive/^([a-zA-ZəŋØ@]+)\d([a-zA-ZəŋØ@]*)$/$1$2/
    # 任意調：韻 + ? + 聲（含舒聲韻偷懶後之 iong8l → iong?l；& = 不確定 4/8）
    - derive/^([a-zA-ZəŋØ@]+)(?:\d|&)(ŋ|[bpPmtTnlgkKhjzcsJZCSØ])$/$1?$2/
    - derive/^([a-zA-ZəŋØ@]+)(?:\d|&)([a-zA-ZəŋØ@]+)$/$1?$2/
    - abbrev/^([a-zA-ZəŋØ@]+)\d.*$/$1/
    - abbrev/^([a-zA-ZəŋØ@]+(?:\d|&)).*$/$1/
    - abbrev/^.+(?:\d|&)(ŋ|[bpPmtTnlgkKhjzcsJZCSØ])$/$1/

    #==========================================================================
    # 【字典編碼】與【鍵盤按鍵】對映
    #==========================================================================
    # 【字典編碼】/【鍵盤按鍵】/【注音符號】
    # 【1】==>【:】==>【ˉ】   # 按鍵【[】輸入：第1調（陰平調）的【高平調】符號
    # 【7】==>【5】==>【˫】   # 按鍵【5】輸入：第7調（陽去調）的【中平調】符號
    # 【3】==>【3】==>【˪】   # 按鍵【3】輸入：第3調（陰去調）的【低平調】符號
    # 【2】==>【4】==>【ˋ】   # 按鍵【4】輸入：第2調（上聲調）的【高降調】符號
    # 【5】==>【6】==>【ˊ】   # 按鍵【6】輸入：第5調（陽平調）的【低升調】符號
    # 【4】==>【[】==>【ˉ】   # 按鍵【[】輸入：第4調（陰入調）的【低促聲調】符號
